<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1565c0" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>Prezzo Netto</title>
  <style>
    :root {
      --primary: #1565c0;
      --primary-dark: #0d47a1;
      --green: #2e7d32;
      --bg: #f0f4f8;
      --border: #bdbdbd;
      --text: #212121;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: 'Roboto', Arial, sans-serif;
      font-size: 16px; touch-action: manipulation;
    }
    /* 100vh su Chrome mobile include l'area della barra URL: il fondo
       della pagina finisce fuori schermo. 100% (e dvh dove c'è) no. */
    #app { height: 100%; display: flex; flex-direction: column; }
    @supports (height: 100dvh) { #app { height: 100dvh; } }

    /* SCREENS */
    .screen { display: none; flex-direction: column; height: 100%; overflow: hidden; }
    .screen.active { display: flex; }

    /* HEADER */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; padding: 8px 12px;
      background: var(--primary); color: white; flex-shrink: 0;
    }
    .header-spacer { flex: 1; }
    .btn-new-receipt {
      background: white; color: var(--primary); border: none;
      padding: 12px 28px; font-size: 18px; font-weight: bold;
      border-radius: 6px; cursor: pointer; flex-shrink: 0;
    }
    .btn-new-receipt:active { background: #dce7f5; }
    .btn-settings {
      background: transparent; border: 2px solid white; color: white;
      width: 52px; height: 52px; font-size: 26px; border-radius: 6px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .btn-settings:active { background: rgba(255,255,255,.2); }

    /* BAG SECTION */
    .bag-section {
      display: flex; gap: 8px; padding: 8px 12px;
      background: #dce7f5; flex-shrink: 0;
    }
    .bag-btn {
      flex: 1; padding: 13px; font-size: 16px; font-weight: bold;
      border: 3px solid var(--border); background: white;
      border-radius: 8px; cursor: pointer;
    }
    .bag-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    .bag-btn:active { opacity: .85; }

    /* CONTENT */
    .content {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column; align-items: center;
      padding: 10px 12px; overflow-y: auto;
    }
    .phase-label {
      font-size: 17px; font-weight: 500;
      margin-bottom: 10px; text-align: center;
    }
    .display-input {
      font-size: 38px; font-weight: bold;
      padding: 10px 24px; border: 3px solid var(--primary);
      border-radius: 8px; min-width: 180px; text-align: center;
      margin-bottom: 10px; background: white; letter-spacing: 2px;
    }

    /* KEYPAD */
    .keypad {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 8px; width: 100%; max-width: 340px;
    }
    .keypad-btn {
      height: 64px; font-size: 26px; font-weight: bold;
      border: 2px solid var(--border); border-radius: 8px;
      background: white; cursor: pointer;
    }
    .keypad-btn:active { background: #e0e0e0; }
    .keypad-btn.ok {
      background: var(--primary); color: white;
      border-color: var(--primary); font-size: 20px;
    }
    .keypad-btn.ok:active { background: var(--primary-dark); }

    /* PLU / WEIGHT INFO */
    .plu-info {
      display: flex; flex-direction: column; align-items: center;
      gap: 4px; padding: 10px 14px; background: white;
      border-radius: 8px; border: 2px solid var(--border);
      width: 100%; max-width: 460px; margin-bottom: 10px;
    }
    .plu-num { font-size: 14px; color: #666; }
    .plu-desc { font-size: 20px; font-weight: bold; text-align: center; }
    .change-btn {
      margin-top: 6px; padding: 9px 18px; font-size: 14px;
      background: white; border: 2px solid var(--primary); color: var(--primary);
      border-radius: 6px; cursor: pointer; font-weight: bold;
    }
    .change-btn:active { background: #e3eaf4; }
    .weight-info {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 10px; font-size: 18px; font-weight: 500;
      background: white; border: 2px solid var(--border);
      border-radius: 8px; padding: 8px 14px;
      width: 100%; max-width: 460px;
    }
    .weight-info span { flex: 1; }

    /* TARA / PRICES */
    .tara-result {
      font-size: 21px; font-weight: bold; margin-bottom: 10px;
      text-align: center; padding: 12px 16px;
      background: #e8f5e9; border-radius: 8px; border: 2px solid #66bb6a;
      width: 100%; max-width: 460px;
    }
    .prices { margin-bottom: 12px; text-align: center; font-size: 18px; width: 100%; max-width: 460px; }
    .prices p { padding: 4px 0; }
    .promo-price { color: #c62828; font-weight: bold; }
    .insert-btn {
      padding: 17px 32px; font-size: 20px; font-weight: bold;
      background: var(--green); color: white; border: none;
      border-radius: 8px; cursor: pointer;
      width: 100%; max-width: 460px;
    }
    .insert-btn:active { background: #1b5e20; }

    /* RECEIPT */
    .receipt-bar {
      flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
      gap: 8px; padding: 6px 14px;
      background: #e8eef6; border-top: 2px solid var(--border);
      font-size: 14px; font-weight: bold;
    }
    .receipt-toggle {
      padding: 8px 16px; font-size: 13px; font-weight: bold;
      background: white; border: 2px solid var(--primary); color: var(--primary);
      border-radius: 6px; cursor: pointer; white-space: nowrap;
    }
    .receipt-toggle:active { background: #e3eaf4; }
    .receipt {
      flex-shrink: 0; height: 28vh; min-height: 120px; overflow-y: auto;
      padding: 8px 14px; font-size: 13px;
      background: #fafafa; line-height: 1.5;
    }
    /* Scrollbar sempre visibile (su Android le overlay scrollbar non si vedono) */
    .receipt::-webkit-scrollbar { width: 10px; }
    .receipt::-webkit-scrollbar-track { background: #eee; }
    .receipt::-webkit-scrollbar-thumb { background: #9e9e9e; border-radius: 5px; }
    /* Riepilogo espanso: nasconde il tastierino e occupa tutto lo spazio */
    .screen.receipt-expanded .content { display: none; }
    .screen.receipt-expanded .receipt { flex: 1; height: auto; }
    .receipt-item { margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px dashed #ddd; }
    .receipt-item p:first-child { font-weight: bold; font-size: 14px; }
    .receipt-item .promo { color: #c62828; }
    .receipt-summary { margin-top: 6px; font-weight: bold; font-size: 13px; border-top: 1px solid var(--border); padding-top: 4px; }
    .receipt-empty { color: #999; font-style: italic; text-align: center; padding: 16px; }

    /* SETTINGS */
    .settings-header {
      display: flex; align-items: center;
      padding: 8px 12px; background: var(--primary); color: white;
      gap: 12px; flex-shrink: 0;
    }
    .btn-home {
      background: transparent; border: 2px solid white; color: white;
      padding: 10px 16px; font-size: 16px; font-weight: bold;
      border-radius: 6px; cursor: pointer; white-space: nowrap;
    }
    .btn-home:active { background: rgba(255,255,255,.2); }
    .settings-title { flex: 1; font-size: 22px; font-weight: bold; text-align: center; }
    .settings-content { flex: 1; overflow-y: auto; padding: 12px; }
    .settings-actions { display: flex; gap: 8px; margin-bottom: 14px; }
    .settings-action-btn {
      flex: 1; padding: 16px; font-size: 18px; font-weight: bold;
      border: 2px solid var(--primary); color: var(--primary);
      background: white; border-radius: 8px; cursor: pointer;
    }
    .settings-action-btn.primary { background: var(--primary); color: white; }
    .settings-action-btn:active { opacity: .85; }
    .plu-list { display: flex; flex-direction: column; gap: 6px; }
    .plu-row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px; background: white;
      border-radius: 8px; border: 1px solid var(--border);
    }
    .plu-label { font-weight: bold; font-size: 16px; min-width: 90px; }
    .articolo-select {
      flex: 1; padding: 10px; font-size: 16px;
      border: 2px solid var(--border); border-radius: 6px; background: white;
    }
    .settings-empty { text-align: center; color: #666; font-size: 18px; padding: 32px 16px; }

    /* MODAL */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.55);
      display: flex; align-items: center; justify-content: center; z-index: 1000;
    }
    .modal-overlay.hidden { display: none; }
    .modal-box {
      background: white; border-radius: 12px; padding: 24px 20px 18px;
      max-width: 500px; width: 92%;
      box-shadow: 0 8px 32px rgba(0,0,0,.3);
    }
    .modal-message { font-size: 18px; margin-bottom: 20px; white-space: pre-line; text-align: center; line-height: 1.5; }
    .modal-buttons { display: flex; flex-direction: column; gap: 8px; }
    .modal-btn {
      padding: 16px; font-size: 16px; font-weight: bold;
      border: 2px solid var(--border); border-radius: 8px;
      background: white; cursor: pointer; text-align: center;
    }
    .modal-btn.primary { background: var(--primary); color: white; border-color: var(--primary); }
    .modal-btn:active { opacity: .85; }
  </style>
</head>
<body>
<div id="app">

  <!-- MAIN SCREEN -->
  <div id="screen-main" class="screen active">
    <header class="header">
      <div class="header-spacer"></div>
      <button id="btn-new-receipt" class="btn-new-receipt">NUOVO SCONTRINO</button>
      <button id="btn-settings" class="btn-settings" aria-label="Impostazioni">&#9881;</button>
    </header>
    <div class="bag-section">
      <button id="btn-bag-small" class="bag-btn active">SACCHETTO PICCOLO</button>
      <button id="btn-bag-large" class="bag-btn">SACCHETTO GRANDE</button>
    </div>
    <div id="content" class="content"></div>
    <div class="receipt-bar">
      <span id="receipt-count">Scontrino: 0 articoli</span>
      <button id="btn-receipt-toggle" class="receipt-toggle">ESPANDI &#9650;</button>
    </div>
    <div id="receipt" class="receipt"></div>
  </div>

  <!-- SETTINGS SCREEN -->
  <div id="screen-settings" class="screen">
    <header class="settings-header">
      <button id="btn-home" class="btn-home">&#8592; HOME</button>
      <h1 class="settings-title">Impostazioni</h1>
      <div class="header-spacer"></div>
    </header>
    <div id="settings-content" class="settings-content"></div>
  </div>

  <!-- MODAL -->
  <div id="modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-box">
      <p id="modal-message" class="modal-message"></p>
      <div id="modal-buttons" class="modal-buttons"></div>
    </div>
  </div>

</div>

<script src="libs/xlsx.min.js"></script>
<script>
'use strict';

// ═══════════════════════════════════════════════════════════════
//  DATABASE  (IndexedDB — no external wrapper)
// ═══════════════════════════════════════════════════════════════
let _db = null;

function initDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('prezzo-netto', 1);
    req.onerror = () => reject(req.error);
    req.onsuccess = () => { _db = req.result; resolve(); };
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('products')) {
        const ps = db.createObjectStore('products', { keyPath: ['plu', 'articolo'] });
        ps.createIndex('by_plu', 'plu', { unique: false });
      }
      if (!db.objectStoreNames.contains('associations')) {
        db.createObjectStore('associations', { keyPath: 'plu' });
      }
    };
  });
}

function hasProducts() {
  return new Promise((res, rej) => {
    const req = _db.transaction('products', 'readonly').objectStore('products').count();
    req.onsuccess = () => res(req.result > 0);
    req.onerror = () => rej(req.error);
  });
}

function getProductsByPlu(plu) {
  return new Promise((res, rej) => {
    const req = _db.transaction('products', 'readonly')
      .objectStore('products').index('by_plu').getAll(plu);
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}

function getAllPLUs() {
  return new Promise((res, rej) => {
    const req = _db.transaction('products', 'readonly').objectStore('products').getAll();
    req.onsuccess = () => {
      const set = new Set(req.result.map(p => p.plu));
      res([...set].sort((a, b) => Number(a) - Number(b)));
    };
    req.onerror = () => rej(req.error);
  });
}

function getAssociation(plu) {
  return new Promise((res, rej) => {
    const req = _db.transaction('associations', 'readonly').objectStore('associations').get(plu);
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}

function getAllAssociations() {
  return new Promise((res, rej) => {
    const req = _db.transaction('associations', 'readonly').objectStore('associations').getAll();
    req.onsuccess = () => res(new Map(req.result.map(a => [a.plu, a.articolo])));
    req.onerror = () => rej(req.error);
  });
}

function saveAssociations(assocMap) {
  return new Promise((res, rej) => {
    const tx = _db.transaction('associations', 'readwrite');
    const store = tx.objectStore('associations');
    store.clear();
    for (const [plu, articolo] of assocMap) {
      if (articolo) store.put({ plu, articolo });
    }
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}

async function importProducts(products) {
  const existingAssoc = await getAllAssociations();

  await new Promise((res, rej) => {
    const tx = _db.transaction('products', 'readwrite');
    const store = tx.objectStore('products');
    store.clear();
    for (const p of products) store.put(p);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });

  const validSet = new Set(products.map(p => p.plu + '|' + p.articolo));
  const validAssoc = new Map();
  for (const [plu, articolo] of existingAssoc) {
    if (validSet.has(plu + '|' + articolo)) validAssoc.set(plu, articolo);
  }

  await new Promise((res, rej) => {
    const tx = _db.transaction('associations', 'readwrite');
    const store = tx.objectStore('associations');
    store.clear();
    for (const [plu, articolo] of validAssoc) store.put({ plu, articolo });
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}

// ═══════════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════════
const BAG_SMALL = 6;
const BAG_LARGE = 14;

let phase = 'A';           // 'A' | 'B' | 'C'
let bagType = 'small';     // 'small' | 'large'
let pluInput = '';
let weightInput = '';
let currentPlu = '';
let currentProduct = null;
let currentWeight = 0;
let receipt = [];

let settingsAssoc = new Map();
let originalAssoc = new Map();
let settingsPluArticolos = new Map();

// ═══════════════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════════════
function getBagWeight() { return bagType === 'small' ? BAG_SMALL : BAG_LARGE; }

function roundToNextEven(x) { return Math.ceil(x / 2) * 2; }

function fmtPrice(n) { return n.toFixed(2).replace('.', ','); }

function $id(id) { return document.getElementById(id); }

// ═══════════════════════════════════════════════════════════════
//  MODAL
// ═══════════════════════════════════════════════════════════════
function showModal(message, buttons) {
  $id('modal-message').textContent = message;
  const btnsEl = $id('modal-buttons');
  btnsEl.innerHTML = '';
  for (const b of buttons) {
    const btn = document.createElement('button');
    btn.className = 'modal-btn' + (b.primary ? ' primary' : '');
    btn.textContent = b.label;
    btn.onclick = () => { $id('modal').classList.add('hidden'); b.action(); };
    btnsEl.appendChild(btn);
  }
  $id('modal').classList.remove('hidden');
}

// ═══════════════════════════════════════════════════════════════
//  KEYPAD
// ═══════════════════════════════════════════════════════════════
function createKeypad(onDigit, onBack, onOk) {
  const pad = document.createElement('div');
  pad.className = 'keypad';
  for (const k of ['1','2','3','4','5','6','7','8','9','⌫','0','OK']) {
    const btn = document.createElement('button');
    btn.className = 'keypad-btn' + (k === 'OK' ? ' ok' : '');
    btn.textContent = k;
    btn.onclick = () => { if (k === '⌫') onBack(); else if (k === 'OK') onOk(); else onDigit(k); };
    pad.appendChild(btn);
  }
  return pad;
}

// ═══════════════════════════════════════════════════════════════
//  RECEIPT
// ═══════════════════════════════════════════════════════════════
function renderReceipt() {
  const el = $id('receipt');
  $id('receipt-count').textContent = 'Scontrino: ' + receipt.length +
    (receipt.length === 1 ? ' articolo' : ' articoli');
  if (!receipt.length) { el.innerHTML = '<p class="receipt-empty">Nessun articolo</p>'; return; }

  let html = receipt.map(item => {
    let h = '<div class="receipt-item">';
    h += `<p>${item.descrizioneArticolo}</p>`;
    h += `<p>Tara totale: ${item.tara} g</p>`;
    h += `<p>Prezzo Netto: ${fmtPrice(item.prezzoNetto)} €/kg</p>`;
    if (item.prezzoNettoPromo) h += `<p class="promo">Prezzo Netto Promo: ${fmtPrice(item.prezzoNettoPromo)} €/kg</p>`;
    return h + '</div>';
  }).join('');

  const small = receipt.filter(r => r.bagType === 'small').length;
  const large = receipt.filter(r => r.bagType === 'large').length;
  html += `<div class="receipt-summary"><p>Sacchetti piccoli: ${small}</p>`;
  if (large > 0) html += `<p>Sacchetti grandi: ${large}</p>`;
  html += '</div>';

  el.innerHTML = html;
  el.scrollTop = el.scrollHeight;
}

// ═══════════════════════════════════════════════════════════════
//  PHASE A — PLU INPUT
// ═══════════════════════════════════════════════════════════════
function renderPhaseA(container) {
  const label = document.createElement('p');
  label.className = 'phase-label';
  label.textContent = 'Inserisci PLU';

  const display = document.createElement('div');
  display.className = 'display-input';
  display.textContent = pluInput || '—';

  const pad = createKeypad(
    d => { if (pluInput.length < 10) { pluInput += d; display.textContent = pluInput; } },
    ()  => { pluInput = pluInput.slice(0, -1); display.textContent = pluInput || '—'; },
    async () => {
      if (!pluInput) return;
      const plu = String(parseInt(pluInput, 10));
      const products = await getProductsByPlu(plu);

      if (!products.length) {
        showModal('PLU non trovato', [{ label: 'OK', primary: true, action: () => { pluInput = ''; renderContent(); } }]);
        return;
      }

      const assoc = await getAssociation(plu);
      const product = assoc ? products.find(p => p.articolo === assoc.articolo) : null;

      if (!product) {
        showModal(
          'Nessun articolo associato a questo PLU.\nAprire le Impostazioni e configurarlo.',
          [{ label: 'OK', primary: true, action: () => { pluInput = ''; renderContent(); } }]
        );
        return;
      }

      currentPlu = plu;
      currentProduct = product;
      pluInput = '';
      weightInput = '';
      phase = 'B';
      renderContent();
    }
  );

  container.appendChild(label);
  container.appendChild(display);
  container.appendChild(pad);
}

// ═══════════════════════════════════════════════════════════════
//  PHASE B — WEIGHT INPUT
// ═══════════════════════════════════════════════════════════════
function renderPhaseB(container) {
  container.appendChild(buildPluInfo(() => {
    phase = 'A'; pluInput = ''; weightInput = ''; currentProduct = null; currentPlu = '';
    renderContent();
  }));

  const label = document.createElement('p');
  label.className = 'phase-label';
  label.textContent = 'Inserisci il peso lordo in GRAMMI (sacchetto compreso)';

  const display = document.createElement('div');
  display.className = 'display-input';
  display.textContent = weightInput || '—';

  const pad = createKeypad(
    d => { if (weightInput.length < 4) { weightInput += d; display.textContent = weightInput; } },
    ()  => { weightInput = weightInput.slice(0, -1); display.textContent = weightInput || '—'; },
    () => {
      if (!weightInput) return;
      const w = parseInt(weightInput, 10);

      if (w > 9999) {
        showModal('Peso troppo elevato', [{ label: 'OK', primary: true, action: () => { weightInput = ''; renderContent(); } }]);
        return;
      }
      if (w <= getBagWeight()) {
        showModal(
          'Il peso lordo deve essere superiore al peso del sacchetto.',
          [{ label: 'OK', primary: true, action: () => { weightInput = ''; renderContent(); } }]
        );
        return;
      }

      currentWeight = w;
      weightInput = '';
      phase = 'C';
      renderContent();
    }
  );

  container.appendChild(label);
  container.appendChild(display);
  container.appendChild(pad);
}

// ═══════════════════════════════════════════════════════════════
//  PHASE C — TARA + PREZZI + INSERISCI
// ═══════════════════════════════════════════════════════════════
function renderPhaseC(container) {
  const product = currentProduct;
  const bagW = getBagWeight();
  const tara = roundToNextEven(((currentWeight - bagW) * product.glassatura / 100) + bagW);

  container.appendChild(buildPluInfo(() => {
    phase = 'A'; pluInput = ''; weightInput = ''; currentProduct = null; currentPlu = '';
    renderContent();
  }));

  const wInfo = document.createElement('div');
  wInfo.className = 'weight-info';
  const wSpan = document.createElement('span');
  wSpan.textContent = 'Peso lordo: ' + currentWeight + ' g';
  const wBtn = document.createElement('button');
  wBtn.className = 'change-btn';
  wBtn.textContent = 'CAMBIA PESO';
  wBtn.onclick = () => { phase = 'B'; weightInput = ''; renderContent(); };
  wInfo.appendChild(wSpan);
  wInfo.appendChild(wBtn);

  const taraEl = document.createElement('p');
  taraEl.className = 'tara-result';
  taraEl.textContent = 'Tara totale in GRAMMI (sacchetto + glassatura): ' + tara;

  const pricesEl = document.createElement('div');
  pricesEl.className = 'prices';
  const p1 = document.createElement('p');
  p1.textContent = 'Prezzo Netto: ' + fmtPrice(product.prezzoNetto) + ' €/kg';
  pricesEl.appendChild(p1);
  if (product.prezzoNettoPromo) {
    const p2 = document.createElement('p');
    p2.className = 'promo-price';
    p2.textContent = 'Prezzo Netto Promo: ' + fmtPrice(product.prezzoNettoPromo) + ' €/kg';
    pricesEl.appendChild(p2);
  }

  const insertBtn = document.createElement('button');
  insertBtn.className = 'insert-btn';
  insertBtn.textContent = 'INSERISCI NUOVO ARTICOLO';
  insertBtn.onclick = () => {
    receipt.push({
      descrizioneArticolo: product.descrizioneArticolo,
      tara,
      prezzoNetto: product.prezzoNetto,
      prezzoNettoPromo: product.prezzoNettoPromo,
      bagType
    });
    phase = 'A'; pluInput = ''; weightInput = ''; currentProduct = null; currentPlu = '';
    bagType = 'small';
    $id('btn-bag-small').classList.add('active');
    $id('btn-bag-large').classList.remove('active');
    renderContent();
    renderReceipt();
  };

  container.appendChild(wInfo);
  container.appendChild(taraEl);
  container.appendChild(pricesEl);
  container.appendChild(insertBtn);
}

function buildPluInfo(onChangePlu) {
  const info = document.createElement('div');
  info.className = 'plu-info';
  const n = document.createElement('span'); n.className = 'plu-num'; n.textContent = 'PLU: ' + currentPlu;
  const d = document.createElement('span'); d.className = 'plu-desc'; d.textContent = currentProduct.descrizioneArticolo;
  const b = document.createElement('button'); b.className = 'change-btn'; b.textContent = 'CAMBIA PLU'; b.onclick = onChangePlu;
  info.appendChild(n); info.appendChild(d); info.appendChild(b);
  return info;
}

function renderContent() {
  const c = $id('content');
  c.innerHTML = '';
  if (phase === 'A') renderPhaseA(c);
  else if (phase === 'B') renderPhaseB(c);
  else renderPhaseC(c);
}

// ═══════════════════════════════════════════════════════════════
//  SETTINGS
// ═══════════════════════════════════════════════════════════════
async function openSettings() {
  const plus = await getAllPLUs();
  settingsAssoc = await getAllAssociations();
  originalAssoc = new Map(settingsAssoc);
  settingsPluArticolos.clear();
  for (const plu of plus) {
    const prods = await getProductsByPlu(plu);
    settingsPluArticolos.set(plu, prods.map(p => p.articolo));
  }
  $id('screen-main').classList.remove('active');
  $id('screen-settings').classList.add('active');
  renderSettings(plus);
}

function renderSettings(plus) {
  const content = $id('settings-content');
  content.innerHTML = '';

  const actions = document.createElement('div');
  actions.className = 'settings-actions';

  const syncBtn = document.createElement('button');
  syncBtn.className = 'settings-action-btn';
  syncBtn.textContent = 'SINCRONIZZA';
  syncBtn.onclick = () => {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = '.xlsx,.xls';
    input.onchange = () => { if (input.files && input.files[0]) syncExcel(input.files[0]); };
    input.click();
  };

  const saveBtn = document.createElement('button');
  saveBtn.className = 'settings-action-btn primary';
  saveBtn.textContent = 'SALVA';
  saveBtn.onclick = async () => {
    await saveAssociations(settingsAssoc);
    originalAssoc = new Map(settingsAssoc);
    showModal('Salvato!', [{ label: 'OK', primary: true, action: () => {} }]);
  };

  actions.appendChild(syncBtn);
  actions.appendChild(saveBtn);
  content.appendChild(actions);

  if (!plus.length) {
    const empty = document.createElement('p');
    empty.className = 'settings-empty';
    empty.textContent = 'Nessun PLU disponibile. Premi SINCRONIZZA per importare i dati.';
    content.appendChild(empty);
    return;
  }

  const list = document.createElement('div');
  list.className = 'plu-list';

  for (const plu of plus) {
    const articles = settingsPluArticolos.get(plu) || [];
    const selected = settingsAssoc.get(plu) || '';

    const row = document.createElement('div'); row.className = 'plu-row';
    const lbl = document.createElement('span'); lbl.className = 'plu-label'; lbl.textContent = 'PLU ' + plu;
    const sel = document.createElement('select'); sel.className = 'articolo-select';

    const optEmpty = document.createElement('option'); optEmpty.value = ''; optEmpty.textContent = '-- nessuno --';
    sel.appendChild(optEmpty);
    for (const art of articles) {
      const opt = document.createElement('option');
      opt.value = art; opt.textContent = art;
      if (art === selected) opt.selected = true;
      sel.appendChild(opt);
    }
    sel.onchange = () => settingsAssoc.set(plu, sel.value);

    row.appendChild(lbl); row.appendChild(sel);
    list.appendChild(row);
  }

  content.appendChild(list);
}

// Confronto tollerante: ignora maiuscole, spazi e simboli.
// Es. l'intestazione Excel "Glassatura %" corrisponde a "Glassatura".
function normKey(s) { return String(s).toLowerCase().replace(/[^a-z0-9]/g, ''); }

function findCol(row, name) {
  const target = normKey(name);
  const key = Object.keys(row).find(k => normKey(k) === target);
  return key !== undefined ? row[key] : undefined;
}

async function syncExcel(file) {
  try {
    const data = await file.arrayBuffer();
    const wb = XLSX.read(data);
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);

    const products = rows.map(row => {
      const pluRaw = findCol(row, 'PLU');
      if (pluRaw === undefined || pluRaw === null || pluRaw === '') return null;
      const articolo = String(findCol(row, 'Articolo') || '').trim();
      if (!articolo) return null;
      const promoRaw = findCol(row, 'PrezzoNettoPromo');
      const promo = (promoRaw !== undefined && promoRaw !== null && promoRaw !== '')
        ? Number(promoRaw) : undefined;
      const glassRaw = findCol(row, 'Glassatura');
      const glassatura = (glassRaw === undefined || glassRaw === null || glassRaw === '')
        ? 0 : Number(glassRaw);
      return {
        plu: String(parseInt(String(pluRaw), 10)),
        articolo,
        descrizioneArticolo: String(findCol(row, 'DescrizioneArticolo') || '').trim(),
        glassatura: isNaN(glassatura) ? 0 : glassatura,
        listinoAlPubblico: Number(findCol(row, 'ListinoAlPubblico') || 0),
        prezzoNetto: Number(findCol(row, 'PrezzoNetto') || 0),
        prezzoNettoPromo: (promo && promo > 0) ? promo : undefined,
      };
    }).filter(Boolean);

    // Sicurezza: se TUTTE le glassature sono 0, l'intestazione della colonna
    // probabilmente non è stata riconosciuta — il calcolo tara sarebbe sbagliato.
    if (products.length && products.every(p => !p.glassatura)) {
      showModal(
        'Attenzione: colonna Glassatura non trovata nel file.\nTutti i valori risultano 0: la tara verrebbe calcolata male.\nImportazione annullata.',
        [{ label: 'OK', primary: true, action: () => {} }]
      );
      return;
    }

    await importProducts(products);

    // Auto-associate primo articolo per PLU senza associazione esistente
    const assocAfterImport = await getAllAssociations();
    const firstArticoloByPlu = new Map();
    for (const p of products) {
      if (!firstArticoloByPlu.has(p.plu)) firstArticoloByPlu.set(p.plu, p.articolo);
    }
    for (const [plu, firstArticolo] of firstArticoloByPlu) {
      if (!assocAfterImport.get(plu)) assocAfterImport.set(plu, firstArticolo);
    }
    await saveAssociations(assocAfterImport);

    const plus = await getAllPLUs();
    settingsAssoc = await getAllAssociations();
    originalAssoc = new Map(settingsAssoc);
    settingsPluArticolos.clear();
    for (const plu of plus) {
      const prods = await getProductsByPlu(plu);
      settingsPluArticolos.set(plu, prods.map(p => p.articolo));
    }

    renderSettings(plus);
    showModal(
      'Importazione completata.\n' + products.length + ' record importati.',
      [{ label: 'OK', primary: true, action: () => {} }]
    );
  } catch (err) {
    console.error(err);
    showModal(
      'Errore durante l\'importazione del file.\nVerifica che sia un file Excel valido.',
      [{ label: 'OK', primary: true, action: () => {} }]
    );
  }
}

function hasUnsavedChanges() {
  const norm = m => { const n = new Map(); for (const [k,v] of m) if (v) n.set(k,v); return n; };
  const curr = norm(settingsAssoc), orig = norm(originalAssoc);
  if (curr.size !== orig.size) return true;
  for (const [k,v] of curr) if (orig.get(k) !== v) return true;
  return false;
}

function goHome() {
  $id('screen-settings').classList.remove('active');
  $id('screen-main').classList.add('active');
}

// ═══════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════
async function init() {
  await initDB();

  $id('btn-bag-small').onclick = () => {
    bagType = 'small';
    $id('btn-bag-small').classList.add('active');
    $id('btn-bag-large').classList.remove('active');
  };
  $id('btn-bag-large').onclick = () => {
    bagType = 'large';
    $id('btn-bag-large').classList.add('active');
    $id('btn-bag-small').classList.remove('active');
  };

  $id('btn-new-receipt').onclick = () => {
    showModal(
      'Tutti i dati dello scontrino corrente verranno eliminati. Confermi?',
      [
        { label: 'OK', primary: true, action: () => {
          receipt = []; phase = 'A'; pluInput = ''; weightInput = '';
          currentProduct = null; currentPlu = '';
          renderContent(); renderReceipt();
        }},
        { label: 'ANNULLA', action: () => {} }
      ]
    );
  };

  $id('btn-settings').onclick = () => openSettings();

  $id('btn-receipt-toggle').onclick = () => {
    const expanded = $id('screen-main').classList.toggle('receipt-expanded');
    $id('btn-receipt-toggle').innerHTML = expanded ? 'CHIUDI &#9660;' : 'ESPANDI &#9650;';
  };

  $id('btn-home').onclick = () => {
    if (!hasUnsavedChanges()) { goHome(); return; }
    showModal(
      'Sono presenti modifiche non salvate.\nVuoi salvare prima di tornare alla schermata principale?',
      [
        { label: 'SALVA E VAI ALLA SCHERMATA PRINCIPALE', primary: true, action: async () => {
          await saveAssociations(settingsAssoc);
          originalAssoc = new Map(settingsAssoc);
          goHome();
        }},
        { label: 'VAI ALLA SCHERMATA PRINCIPALE SENZA SALVARE', action: () => goHome() },
        { label: 'ANNULLA', action: () => {} }
      ]
    );
  };

  renderContent();
  renderReceipt();

  if (!await hasProducts()) await openSettings();
}

// Service Worker registration
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(console.error);
}

init().catch(console.error);
</script>
